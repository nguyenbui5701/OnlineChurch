<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OnlineChurch — Canvas DEMO offline</title>
  <link rel="stylesheet" href="/overlay/app.css">
  <script type="module" src="/overlay/app.js"></script>
</head>
<body>
  <main>
    <header class="toolbar">
      <a href="/">← OnlineChurch</a>
      <span class="badge">DEMO / Offline</span>
      <label><input id="guides" type="checkbox" checked> Đường hướng dẫn</label>
    </header>
    <section class="workspace" aria-label="Canvas DEMO 1080 × 1920">
      <div id="stage-host">
        <p id="render-status" role="status">Đang khởi tạo canvas…</p>
      </div>
    </section>
    <footer>
      <strong>Không gian mô phỏng — không phải Thánh lễ hay bí tích</strong>
      <span>Hình học mẫu · Chưa có hình ảnh chính thức, nhân vật hoặc hiệu ứng.</span>
      <span class="mask-status">MASKS NOT APPROVED — DEMO ONLY</span>
    </footer>
  </main>
  <noscript>Canvas cần JavaScript cục bộ. Không có kết nối LIVE.</noscript>
</body>
</html>
